[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bomft"
version = "0.1.0"
description = "Anjani FIBC BOM agent — LoRA fine-tuning, serving and evaluation (HPC / 1xH100)"
requires-python = ">=3.10"
# Heavy deps (torch, unsloth, vllm) are NOT listed here on purpose: on HPC they
# come from requirements.txt (installed after torch) so pip never pulls a second
# torch. Only the always-safe, torch-free deps are declared.
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bomft = "bomft.cli:main"

[tool.setuptools]
packages = ["bomft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
